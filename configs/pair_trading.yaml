time:
  train_startingDate: '2023-01-01'
  train_endingDate: '2024-12-31'
  test_startingDate: '2023-01-01'
  test_endingDate: '2024-12-31'

pair_env:
  dataset: Incremental_Data/pair_sample.csv
  input_length: 16
  reward_horizon: 4
  action_scales: [-2, -1, 0, 1, 2]
  transaction_cost: 0.001

agent:
  algorithm: PPO
  model: TimesNet
  buffer_size: 128
  ModelPath: result/default/model/ppo_pair.pth

train:
  lr: 0.0001
  gamma: 0.99
  init_money: 100000
  target_update: 10
  EPS_START: 0.9
  EPS_END: 0.05
  EPS_DECAY: 200

device: cuda
